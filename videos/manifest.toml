# Source of truth for all video assets used in the slide decks.
#
# Raw originals live in `videos/raw/` (gitignored, mirrored from Google Drive
# via `pnpm videos:sync`). Encoded outputs go to `lectures/content/public/videos/`
# (also gitignored, published to the GitHub Release tagged `videos`).
#
# Workflow:
#   1. Drop a new raw file in videos/raw/ (or `pnpm videos:sync` from Drive)
#   2. Add an entry below with the right profile
#   3. `pnpm videos:encode`  - regenerates web copies (idempotent)
#   4. `pnpm videos:publish` - uploads to GH Release for the deployed build
#   5. (optional) `hq = true` on an entry + `pnpm videos:encode-hq` - writes a
#      venue-quality HEVC copy to lectures/content/public/videos-hq/ (gitignored,
#      never published). `pnpm dev` plays it first; a `--keep-videos` build
#      falls back to it offline. Size/res via [defaults] hq_bitrate/hq_long_edge_px.
#
# Profiles:
#   remux       - lossless stream copy + faststart. Use when source is already
#                 a well-encoded web-friendly codec (HEVC/H.264 <= ~5 Mbps).
#   standard    - HEVC CRF 24, 1080p cap, AAC 128k. General-purpose re-encode.
#   standard-tight - HEVC CRF 27, 1080p cap, AAC 128k. Same res as standard, more aggressive quantization for long clips that blow the 200 MB budget.
#   silent-loop - HEVC CRF 26, 1080p cap, audio stripped. Background loops.
#   high-motion - HEVC CRF 22, 1080p cap, AAC 192k. Sims, fast action, CGI.
#   web-h264    - H.264 CRF 22 capped at 8 Mbps, 1080p cap, AAC 160k. Plays on
#                 every browser (the HEVC profiles fail on Firefox / Linux Chrome).

[defaults]
source_remote = "gdrive:CERN_videos/raw"
release_tag   = "videos"
max_size_mb   = 200  # fail encoding if output exceeds this
hq_long_edge_px = 2560  # HQ tier: 1440p (the master is 4K60; 3840 keeps it, ~2x the size)
hq_bitrate      = "24M" # HQ tier: HEVC target bitrate (24 Mbps ≈ 850 MB for the 4:42 cold open)

