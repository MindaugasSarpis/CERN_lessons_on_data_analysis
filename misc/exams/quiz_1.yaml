category: lodac_quiz_1

questions:
  # ── File handling ───────────────────────────────────────────────
  - type: multichoice
    name: what_is_a_file
    text: "What is a file, at the simplest level?"
    answers:
      - text: "A named sequence of bytes stored by the operating system."
        correct: true
      - text: "A window shown on the screen."
      - text: "A running program in memory."
      - text: "A network connection to another computer."
    explanation: |
      Everything on disk — text, images, programs — is ultimately a named blob of bytes that the OS keeps track of.

  - type: multichoice
    name: file_extensions
    text: "What does a file extension like `.csv` or `.png` actually tell you?"
    answers:
      - text: "A convention for how the contents should be interpreted — it does not by itself guarantee the format."
        correct: true
      - text: "The exact number of bytes in the file."
      - text: "Which user created the file."
      - text: "Whether the file is encrypted."
    explanation: |
      Extensions are hints for humans and applications; renaming a file does not change its actual contents.

  - type: multichoice
    name: scriptable_workflow
    text: "What makes a data-analysis workflow 'scriptable' rather than 'non-scriptable'?"
    answers:
      - text: "Every step can be expressed as code or commands and re-run from scratch to reproduce the same results."
        correct: true
      - text: "It is written by hand in a lab notebook."
      - text: "It relies on clicking through menus in a graphical application."
      - text: "It can only be run once, then discarded."
    explanation: |
      Scriptable workflows are reproducible and shareable; non-scriptable ones — e.g. GUI point-and-click — are hard to replay or verify.

  - type: multichoice
    name: gui_limits
    text: "Why are purely click-based (non-scriptable) workflows risky for research data analysis?"
    answers:
      - text: "There is no reliable record of what was done, so the result is hard to reproduce or audit later."
        correct: true
      - text: "Graphical applications cannot open data files."
      - text: "Results from a GUI are always numerically wrong."
      - text: "A GUI workflow cannot be shared with a collaborator in any form."
    explanation: |
      Without a written trail of steps, neither you nor collaborators can rerun the analysis exactly — a core problem for scientific reproducibility.

  - type: multichoice
    name: relative_vs_absolute_paths
    text: "Why do shared projects usually prefer relative paths (`data/raw/run42.csv`) over absolute paths (`/Users/alice/proj/data/raw/run42.csv`)?"
    answers:
      - text: "Relative paths make the project portable — it still works when someone clones it elsewhere."
        correct: true
      - text: "Relative paths are faster for the OS to resolve."
      - text: "Absolute paths are not supported on Linux."
      - text: "Relative paths automatically encrypt the file location."
    explanation: |
      Absolute paths tie a project to one machine and user. Relative paths keep the project self-contained.

  - type: multichoice
    name: text_vs_binary
    text: "What is the main practical difference between a text file and a binary file?"
    answers:
      - text: "Text files are human-readable in any editor; binary files need the right program to interpret them."
        correct: true
      - text: "Binary files are always larger than text files."
      - text: "Text files cannot be edited after they are saved."
      - text: "Only binary files can be stored on SSDs."
    explanation: |
      Plain text is a durable, portable interface — one of the reasons formats like CSV and Markdown are so widely used.

  - type: multichoice
    name: here_near_far_backups
    text: "The 'here, near, far' backup idea says to keep copies in three different places. Why three?"
    answers:
      - text: "Different copies defend against different failure modes — from a deleted file to a destroyed building."
        correct: true
      - text: "Three is the maximum number of copies most drives support."
      - text: "More copies make files load faster."
      - text: "It is a legal requirement for storing any data."
    explanation: |
      Local, nearby, and distant copies each protect against a different class of disaster.

  # ── Data management plans ───────────────────────────────────────
  - type: multichoice
    name: what_is_a_dmp
    text: "What is a data management plan (DMP)?"
    answers:
      - text: "A document describing how data will be collected, organised, stored, shared, and preserved during and after a project."
        correct: true
      - text: "A script that automatically backs up your files every night."
      - text: "A type of database used only at CERN."
      - text: "A legal contract between two computers."
    explanation: |
      A DMP is the written plan for the whole life of a project's data — from collection through long-term preservation and reuse.

  - type: multichoice
    name: dmp_raw_vs_derived
    text: "A good data management plan typically separates raw data from derived data. Why?"
    answers:
      - text: "Raw data is the unique, irreplaceable record; derived data can always be regenerated from it if the analysis is reproducible."
        correct: true
      - text: "Derived data takes up less disk space than raw data."
      - text: "Raw data cannot be opened by standard software."
      - text: "It is a requirement of the Python language."
    explanation: |
      Keeping raw inputs untouched means any result can be traced and recomputed, while derived files can be safely deleted or rebuilt.

  # ── Version control ─────────────────────────────────────────────
  - type: multichoice
    name: what_is_git
    text: "What is Git, at its core?"
    answers:
      - text: "A system for tracking changes to files over time, with the ability to branch, merge, and collaborate."
        correct: true
      - text: "A cloud storage service owned by GitHub."
      - text: "A programming language for data analysis."
      - text: "A backup service that runs automatically on all computers."
    explanation: |
      Git is a distributed version control system. GitHub is one of many hosts built on top of it.

  - type: multichoice
    name: git_vs_copies_intuition
    text: "A student keeps `analysis.py`, `analysis_v2.py`, `analysis_final.py`, `analysis_final_REAL.py` side by side. What does Git give that this scheme does not?"
    answers:
      - text: "One canonical file with a full, navigable history, plus branches for alternatives."
        correct: true
      - text: "Smaller file sizes on disk."
      - text: "A faster Python interpreter."
      - text: "Automatic conversion of Python to Markdown."
    explanation: |
      Git separates 'the current file' from 'the history of the file' — manual copies conflate the two.

  - type: multichoice
    name: what_is_a_commit
    text: "What does a Git commit represent?"
    answers:
      - text: "A labelled snapshot of the project at a specific point in time."
        correct: true
      - text: "A running copy of the program."
      - text: "A request to upload files to the internet."
      - text: "A scheduled backup that happens every hour."
    explanation: |
      Each commit is an immutable checkpoint with a message, an author, and a link to its parents.

  - type: multichoice
    name: why_commit_messages
    text: "Why bother writing a meaningful commit message?"
    answers:
      - text: "Future readers (including you) need to understand why a change was made, not just what changed."
        correct: true
      - text: "The message is what actually stores the file contents."
      - text: "Messages make the repository faster."
      - text: "They are shown as advertisements on GitHub."
    explanation: |
      A diff shows *what*; the message is where *why* lives. Good history pays off months or years later.

  - type: multichoice
    name: branches_intuition
    text: "What is a Git branch most usefully thought of as?"
    answers:
      - text: "A separate line of development where you can try changes without disturbing the main project."
        correct: true
      - text: "A backup copy stored on another machine."
      - text: "A folder inside the project."
      - text: "A way to encrypt your files."
    explanation: |
      Branches let different ideas coexist; merging brings them back together when ready.

  - type: multichoice
    name: version_control_collaboration
    text: "Why is version control especially valuable when several people work on the same project?"
    answers:
      - text: "It records who changed what and when, and provides tools to merge contributions safely."
        correct: true
      - text: "It prevents anyone except the project owner from editing files."
      - text: "It automatically translates code between programming languages."
      - text: "It stops two people from ever opening the same file."
    explanation: |
      Without version control, shared edits either overwrite each other or require manual coordination; Git makes collaboration traceable and reversible.
