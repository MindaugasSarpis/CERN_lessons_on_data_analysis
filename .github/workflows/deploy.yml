name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [ main, ff2025 ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # For project Pages: prod needs "/<repo>/" base; previews use "/"
      BASE_PATH: ${{ github.ref == 'refs/heads/main' && format('/{0}/', github.event.repository.name) || '/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npx -y @slidev/cli@latest build \
            --out dist \
            lectures/content/Lessons_on_Data_Analysis_from_CERN.md \
            --base "${BASE_PATH}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages           # production (stable URL)
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (prod)
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-preview:
    if: github.ref == 'refs/heads/ff2025'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging-pages          # preview (ephemeral URL)
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (preview)
        id: deployment
        uses: actions/deploy-pages@v4