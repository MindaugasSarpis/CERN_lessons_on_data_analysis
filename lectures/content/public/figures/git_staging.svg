<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="wdFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stageFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#422006" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="repoFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#052e2b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.9"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Title -->
  <text x="800" y="70" text-anchor="middle" font-size="38" font-weight="700" fill="#f1f5f9">The Three Trees of Git</text>
  <text x="800" y="105" text-anchor="middle" font-size="20" fill="#94a3b8">Working Directory → Staging Area → Repository</text>

  <!-- Zone 1: Working Directory -->
  <g filter="url(#soft)">
    <rect x="60" y="160" width="380" height="560" rx="20" fill="url(#wdFill)" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <text x="250" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#38bdf8">📁 Working Directory</text>
  <text x="250" y="232" text-anchor="middle" font-size="15" fill="#94a3b8">Files you edit on disk</text>

  <g font-family="'JetBrains Mono','Fira Code',monospace">
    <rect x="100" y="275" width="300" height="70" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="120" y="310" font-size="18" fill="#e2e8f0">📄 file1.txt</text>
    <text x="120" y="332" font-size="13" fill="#64748b">modified</text>

    <rect x="100" y="365" width="300" height="70" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="120" y="400" font-size="18" fill="#e2e8f0">📄 file2.txt</text>
    <text x="120" y="422" font-size="13" fill="#64748b">new</text>

    <rect x="100" y="455" width="300" height="70" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="120" y="490" font-size="18" fill="#94a3b8">📄 file3.txt</text>
    <text x="120" y="512" font-size="13" fill="#64748b">unchanged</text>
  </g>

  <!-- Zone 2: Staging Area -->
  <g filter="url(#soft)">
    <rect x="610" y="160" width="380" height="560" rx="20" fill="url(#stageFill)" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="800" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#f59e0b">🗂️ Staging Area</text>
  <text x="800" y="232" text-anchor="middle" font-size="15" fill="#94a3b8">Snapshot for the next commit</text>

  <g font-family="'JetBrains Mono','Fira Code',monospace">
    <rect x="650" y="275" width="300" height="70" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="670" y="310" font-size="18" fill="#fde68a">📄 file1.txt</text>
    <text x="670" y="332" font-size="13" fill="#a16207">staged ✓</text>

    <rect x="650" y="365" width="300" height="70" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="670" y="400" font-size="18" fill="#fde68a">📄 file2.txt</text>
    <text x="670" y="422" font-size="13" fill="#a16207">staged ✓</text>
  </g>

  <!-- Zone 3: Repository -->
  <g filter="url(#soft)">
    <rect x="1160" y="160" width="380" height="560" rx="20" fill="url(#repoFill)" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="1350" y="205" text-anchor="middle" font-size="24" font-weight="700" fill="#10b981">📚 Repository</text>
  <text x="1350" y="232" text-anchor="middle" font-size="15" fill="#94a3b8">Commit history (.git)</text>

  <!-- branch pointer -->
  <rect x="1415" y="262" width="90" height="32" rx="6" fill="#10b981"/>
  <text x="1460" y="284" text-anchor="middle" font-size="15" font-weight="700" fill="#052e2b" font-family="'JetBrains Mono',monospace">main</text>
  <line x1="1415" y1="290" x2="1332" y2="310" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Commit chain -->
  <g font-family="'JetBrains Mono','Fira Code',monospace">
    <circle cx="1250" cy="310" r="14" fill="#10b981" stroke="#052e2b" stroke-width="2"/>
    <text x="1280" y="307" font-size="16" fill="#e2e8f0">a2129cb</text>
    <text x="1280" y="327" font-size="12" fill="#64748b">HEAD</text>
    <line x1="1250" y1="324" x2="1250" y2="376" stroke="#475569" stroke-width="2"/>

    <circle cx="1250" cy="390" r="12" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="1280" y="387" font-size="15" fill="#cbd5e1">892134f</text>
    <text x="1280" y="405" font-size="11" fill="#64748b">HEAD~1</text>
    <line x1="1250" y1="402" x2="1250" y2="454" stroke="#475569" stroke-width="2"/>

    <circle cx="1250" cy="468" r="12" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="1280" y="465" font-size="15" fill="#cbd5e1">59e230a</text>
    <text x="1280" y="483" font-size="11" fill="#64748b">HEAD~2</text>
    <line x1="1250" y1="480" x2="1250" y2="532" stroke="#475569" stroke-width="2"/>

    <circle cx="1250" cy="546" r="12" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="1280" y="543" font-size="15" fill="#cbd5e1">3a54f76</text>
    <line x1="1250" y1="558" x2="1250" y2="610" stroke="#475569" stroke-width="2"/>

    <circle cx="1250" cy="624" r="12" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="1280" y="621" font-size="15" fill="#cbd5e1">43fe423</text>
    <text x="1280" y="639" font-size="11" fill="#64748b">initial</text>
  </g>

  <!-- Flow arrows -->

  <!-- WD → Staging -->
  <path d="M 455 360 L 595 360" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="445" y="315" width="160" height="34" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1"/>
  <text x="525" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#fde68a" font-family="'JetBrains Mono',monospace">git add</text>

  <!-- Staging → WD (undo) -->
  <path d="M 595 430 L 455 430" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="525" y="462" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="'JetBrains Mono',monospace">git restore --staged</text>

  <!-- Staging → Repo -->
  <path d="M 1005 360 L 1145 360" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="995" y="315" width="160" height="34" rx="6" fill="#052e2b" stroke="#10b981" stroke-width="1"/>
  <text x="1075" y="338" text-anchor="middle" font-size="15" font-weight="600" fill="#6ee7b7" font-family="'JetBrains Mono',monospace">git commit</text>

  <!-- Repo → WD (long arc) -->
  <path d="M 1350 735 Q 800 830 250 735" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="800" y="820" text-anchor="middle" font-size="15" fill="#94a3b8" font-family="'JetBrains Mono',monospace">git restore &lt;file&gt;   ·   git checkout</text>

  <!-- Caption -->
  <text x="800" y="875" text-anchor="middle" font-size="13" fill="#64748b">Solid arrows = promoting changes forward   •   Dashed arrows = undoing / pulling back</text>
</svg>
