<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gRoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gQual" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="gQuant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="gDate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="gNom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gOrd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c2d12" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="gCont" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .cat-title { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .sub-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .cat-sub   { font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .leaf-text { font-size: 14px; fill: #e2e8f0; text-anchor: middle; font-weight: 500; }
      .leaf-sub  { font-size: 11px; fill: #64748b; text-anchor: middle; font-family: 'JetBrains Mono',monospace; }
    </style>
  </defs>

  <!-- Title -->
  <text x="800" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#f1f5f9">Types of Data</text>
  <text x="800" y="66" text-anchor="middle" font-size="13" fill="#94a3b8">A taxonomy of what you'll actually encounter</text>

  <!-- ROOT -->
  <g filter="url(#soft)">
    <rect x="720" y="90" width="160" height="56" rx="12" fill="url(#gRoot)" stroke="#f1f5f9" stroke-width="1.8"/>
  </g>
  <text x="800" y="118" class="cat-title" fill="#f1f5f9">📊 Data</text>
  <text x="800" y="136" class="cat-sub">the raw input</text>

  <!-- Root → three branches -->
  <path d="M 800 146 Q 800 180 280 200" stroke="#f59e0b" stroke-width="1.8" fill="none" opacity="0.5"/>
  <path d="M 800 146 L 800 200"         stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.5" stroke-dasharray="4 4"/>
  <path d="M 800 146 Q 800 180 1320 200" stroke="#10b981" stroke-width="1.8" fill="none" opacity="0.5"/>

  <!-- LEVEL 2 branches -->
  <g filter="url(#soft)">
    <rect x="130" y="200" width="300" height="74" rx="12" fill="url(#gQual)" stroke="#f59e0b" stroke-width="1.8"/>
  </g>
  <text x="280" y="232" class="cat-title" fill="#f59e0b">🏷️ Qualitative</text>
  <text x="280" y="254" class="cat-sub">categorical · labels</text>

  <g filter="url(#soft)">
    <rect x="650" y="200" width="300" height="74" rx="12" fill="url(#gDate)" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 3"/>
  </g>
  <text x="800" y="232" class="cat-title" fill="#38bdf8">📅 Date &amp; Time</text>
  <text x="800" y="254" class="cat-sub">behaves like both flavours</text>

  <g filter="url(#soft)">
    <rect x="1170" y="200" width="300" height="74" rx="12" fill="url(#gQuant)" stroke="#10b981" stroke-width="1.8"/>
  </g>
  <text x="1320" y="232" class="cat-title" fill="#10b981">🔢 Quantitative</text>
  <text x="1320" y="254" class="cat-sub">numerical · measurable</text>

  <!-- LEVEL 3 connectors -->
  <!-- Qualitative → Nominal/Ordinal -->
  <path d="M 210 274 Q 210 320 150 360" stroke="#f59e0b" stroke-width="1.4" fill="none" opacity="0.4"/>
  <path d="M 360 274 Q 360 320 430 360" stroke="#f59e0b" stroke-width="1.4" fill="none" opacity="0.4"/>
  <!-- Quantitative → Discrete/Continuous -->
  <path d="M 1240 274 Q 1240 320 1160 360" stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.4"/>
  <path d="M 1400 274 Q 1400 320 1450 360" stroke="#10b981" stroke-width="1.4" fill="none" opacity="0.4"/>

  <!-- LEVEL 3 subtype cards -->
  <g filter="url(#soft)">
    <rect x="30" y="360" width="240" height="66" rx="11" fill="url(#gNom)" stroke="#fbbf24" stroke-width="1.6"/>
  </g>
  <text x="150" y="390" class="sub-title" fill="#fbbf24">Nominal</text>
  <text x="150" y="410" class="cat-sub">unordered categories</text>

  <g filter="url(#soft)">
    <rect x="310" y="360" width="240" height="66" rx="11" fill="url(#gOrd)" stroke="#fb923c" stroke-width="1.6"/>
  </g>
  <text x="430" y="390" class="sub-title" fill="#fb923c">Ordinal</text>
  <text x="430" y="410" class="cat-sub">ordered categories</text>

  <g filter="url(#soft)">
    <rect x="1040" y="360" width="240" height="66" rx="11" fill="url(#gDisc)" stroke="#60a5fa" stroke-width="1.6"/>
  </g>
  <text x="1160" y="390" class="sub-title" fill="#60a5fa">🧮 Discrete</text>
  <text x="1160" y="410" class="cat-sub">countable · integers</text>

  <g filter="url(#soft)">
    <rect x="1330" y="360" width="240" height="66" rx="11" fill="url(#gCont)" stroke="#c084fc" stroke-width="1.6"/>
  </g>
  <text x="1450" y="390" class="sub-title" fill="#c084fc">∞ Continuous</text>
  <text x="1450" y="410" class="cat-sub">real-valued</text>

  <!-- LEVEL 4 connectors to example leaves -->
  <path d="M 150 426 L 150 480" stroke="#fbbf24" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="3 5"/>
  <path d="M 430 426 L 430 480" stroke="#fb923c" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="3 5"/>
  <path d="M 1160 426 L 1160 480" stroke="#60a5fa" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="3 5"/>
  <path d="M 1450 426 L 1450 480" stroke="#c084fc" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="3 5"/>

  <!-- LEVEL 4 example leaves -->
  <g>
    <rect x="30" y="490" width="240" height="130" rx="10" fill="#1c1917" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1.1"/>
    <text x="150" y="518" class="leaf-text">Hair colour</text>
    <text x="150" y="538" class="leaf-sub">brown · blond · black</text>
    <line x1="60" y1="555" x2="240" y2="555" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <text x="150" y="578" class="leaf-text">Blood type</text>
    <text x="150" y="598" class="leaf-sub">A · B · AB · O</text>
  </g>
  <g>
    <rect x="310" y="490" width="240" height="130" rx="10" fill="#1c1917" fill-opacity="0.4" stroke="#fb923c" stroke-width="1.1"/>
    <text x="430" y="518" class="leaf-text">Satisfaction rating</text>
    <text x="430" y="538" class="leaf-sub">★ · ★★ · ★★★ · ★★★★</text>
    <line x1="340" y1="555" x2="520" y2="555" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <text x="430" y="578" class="leaf-text">Education level</text>
    <text x="430" y="598" class="leaf-sub">BSc &lt; MSc &lt; PhD</text>
  </g>
  <g>
    <rect x="1040" y="490" width="240" height="130" rx="10" fill="#0f172a" fill-opacity="0.4" stroke="#60a5fa" stroke-width="1.1"/>
    <text x="1160" y="518" class="leaf-text">Number of children</text>
    <text x="1160" y="538" class="leaf-sub">0, 1, 2, 3, …</text>
    <line x1="1070" y1="555" x2="1250" y2="555" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <text x="1160" y="578" class="leaf-text">Counts of cattle</text>
    <text x="1160" y="598" class="leaf-sub">42 · 117 · 860</text>
  </g>
  <g>
    <rect x="1330" y="490" width="240" height="130" rx="10" fill="#1e1b4b" fill-opacity="0.4" stroke="#c084fc" stroke-width="1.1"/>
    <text x="1450" y="518" class="leaf-text">Height of patients</text>
    <text x="1450" y="538" class="leaf-sub">1.72 m · 168.4 cm</text>
    <line x1="1360" y1="555" x2="1540" y2="555" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <text x="1450" y="578" class="leaf-text">Length of a snake</text>
    <text x="1450" y="598" class="leaf-sub">0.83 m · 127 cm</text>
  </g>

  <!-- Date & Time examples (center column) -->
  <path d="M 800 274 L 800 440" stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.35" stroke-dasharray="3 5"/>
  <g>
    <rect x="670" y="450" width="260" height="170" rx="10" fill="#0b1220" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="5 3"/>
    <text x="800" y="478" class="leaf-text">Timestamp</text>
    <text x="800" y="498" class="leaf-sub">2025-10-24T10:24Z</text>
    <line x1="700" y1="515" x2="900" y2="515" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <text x="800" y="538" class="leaf-text">Date</text>
    <text x="800" y="558" class="leaf-sub">2025-10-24</text>
    <line x1="700" y1="575" x2="900" y2="575" stroke="#334155" stroke-width="1" opacity="0.5"/>
    <text x="800" y="598" class="leaf-text">Duration</text>
    <text x="800" y="618" class="leaf-sub">3.2 days · 127 ms</text>
  </g>

  <!-- Bottom caption / legend -->
  <text x="800" y="680" text-anchor="middle" font-size="13" fill="#94a3b8" font-style="italic">
    Every dataset you meet will be some combination of these flavours.
  </text>
</svg>
