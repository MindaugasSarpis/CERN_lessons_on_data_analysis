<?xml version="1.0" encoding="UTF-8"?>
<!-- Lecture 05, slide "Stop at a Line: the Debugger".
     Schematic of VS Code stopped at a breakpoint on line 9 of scripts/mean_temp.py
     (the weather project), on the third measured row of weather.csv. The values are
     those Python holds at that moment (run with Python 3.14):
     line = '2016-01-01T02:00,-5.5,95,2.7', temp = -5.5, total = -9.2, count = 2.
     Hand-built; see docs/svg-figure-recipe.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono  { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace; }
      .code  { font-size: 25px; fill: #e2e8f0; }
      .num   { font-size: 22px; fill: #64748b; text-anchor: end; }
      .var   { font-size: 22px; }
      .head  { font-size: 19px; font-weight: 700; fill: #94a3b8; letter-spacing: 2px; }
      .chip  { font-size: 21px; font-weight: 600; fill: #e2e8f0; }
      .key   { font-size: 19px; fill: #94a3b8; }
      .note  { font-size: 20px; fill: #94a3b8; font-style: italic; }
      .n     { fill: #7dd3fc; }
      .s     { fill: #fdba74; }
      .f     { fill: #86efac; }
      .dim   { fill: #94a3b8; }
      .kw    { fill: #c084fc; }
    </style>
  </defs>

  <!-- debug toolbar -->
  <g filter="url(#soft)">
    <rect x="500" y="10" width="600" height="58" rx="12" fill="url(#gPanel)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <polygon points="524,26 524,52 546,39" fill="#38bdf8"/>
  <text x="556" y="46" class="chip">Continue</text>
  <text x="652" y="46" class="key mono">F5</text>
  <path d="M 706 46 A 15 15 0 0 1 736 46" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
  <polygon points="729,42 742,42 736,52" fill="#38bdf8"/>
  <circle cx="721" cy="50" r="4" fill="#38bdf8"/>
  <text x="752" y="46" class="chip">Step Over</text>
  <text x="858" y="46" class="key mono">F10</text>
  <rect x="918" y="28" width="22" height="22" rx="3" fill="#f87171"/>
  <text x="950" y="46" class="chip">Stop</text>
  <text x="1002" y="46" class="key mono">Shift+F5</text>

  <!-- Variables panel -->
  <g filter="url(#soft)">
    <rect x="20" y="86" width="600" height="454" rx="14" fill="url(#gPanel)" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <text x="44" y="124" class="head">VARIABLES</text>
  <line x1="20" y1="140" x2="620" y2="140" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="180" class="var mono dim">v Locals</text>
  <text x="96" y="220" class="var mono"><tspan class="n">count</tspan><tspan class="dim"> = </tspan><tspan class="f">2</tspan></text>
  <text x="96" y="260" class="var mono"><tspan class="n">line</tspan><tspan class="dim"> = </tspan><tspan class="s">'2016-01-01T02:00,-5.5,95,2.7'</tspan></text>
  <text x="70" y="300" class="var mono"><tspan class="dim">&gt; </tspan><tspan class="n">lines</tspan><tspan class="dim"> = </tspan><tspan class="s">['time,temp_c,humidity_pct,…</tspan></text>
  <text x="70" y="340" class="var mono"><tspan class="dim">&gt; </tspan><tspan class="n">parts</tspan><tspan class="dim"> = </tspan><tspan class="s">['2016-01-01T02:00', '-5.5', …</tspan></text>
  <text x="96" y="380" class="var mono"><tspan class="n">temp</tspan><tspan class="dim"> = </tspan><tspan class="f">-5.5</tspan></text>
  <text x="96" y="420" class="var mono"><tspan class="n">total</tspan><tspan class="dim"> = </tspan><tspan class="f">-9.2</tspan></text>
  <text x="44" y="462" class="var mono dim">&gt; Globals</text>

  <!-- Editor panel -->
  <g filter="url(#soft)">
    <rect x="640" y="86" width="940" height="454" rx="14" fill="url(#gPanel)" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="664" y="124" class="head" letter-spacing="0">mean_temp.py</text>
  <line x1="640" y1="140" x2="1580" y2="140" stroke="#334155" stroke-width="1.5"/>

  <!-- the line the debugger stopped before -->
  <rect x="641" y="361" width="938" height="42" fill="#eab308" fill-opacity="0.20"/>
  <rect x="641" y="361" width="6" height="42" fill="#eab308"/>

  <g class="mono">
    <text x="726" y="182" class="num">4</text>
    <text x="750" y="182" class="code"><tspan class="kw">for</tspan> line <tspan class="kw">in</tspan> lines[<tspan class="f">1</tspan>:]:</text>
    <text x="726" y="224" class="num">5</text>
    <text x="750" y="224" class="code" xml:space="preserve">    parts = line.split(<tspan class="s">","</tspan>)</text>
    <text x="726" y="266" class="num">6</text>
    <text x="750" y="266" class="code" xml:space="preserve">    temp = float(parts[<tspan class="f">1</tspan>])</text>
    <text x="726" y="308" class="num">7</text>
    <text x="750" y="308" class="code" xml:space="preserve">    <tspan class="kw">if</tspan> temp == <tspan class="f">-999</tspan>:</text>
    <text x="726" y="350" class="num">8</text>
    <text x="750" y="350" class="code" xml:space="preserve">        <tspan class="kw">continue</tspan></text>
    <text x="726" y="392" class="num" fill="#e2e8f0">9</text>
    <text x="750" y="392" class="code" xml:space="preserve">    total = total + temp</text>
    <text x="726" y="434" class="num">10</text>
    <text x="750" y="434" class="code" xml:space="preserve">    count = count + <tspan class="f">1</tspan></text>
    <text x="726" y="476" class="num">11</text>
    <text x="750" y="476" class="code">print(count, total / count)</text>
  </g>

  <!-- breakpoint -->
  <circle cx="668" cy="382" r="10" fill="#ef4444"/>

  <!-- callouts -->
  <text x="664" y="524" class="note">red dot: the breakpoint</text>
  <text x="1558" y="524" class="note" text-anchor="end">yellow: stopped before this line</text>
</svg>
