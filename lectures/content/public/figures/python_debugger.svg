<?xml version="1.0" encoding="UTF-8"?>
<!-- Lecture 06, slide "The Debugger: Stop at a Line".
     Schematic of VS Code stopped at a breakpoint on line 16 of scripts/mean_period.py,
     second turn of the loop. The values are the ones the Python Debugger reports
     (checked through its debug adapter): line = '30,11.05', parts = ['30', '11.05'],
     total = 0.9019999999999999. Hand-built; see docs/svg-figure-recipe.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono  { font-family: 'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,monospace; }
      .code  { font-size: 25px; fill: #e2e8f0; }
      .num   { font-size: 22px; fill: #64748b; text-anchor: end; }
      .var   { font-size: 22px; }
      .head  { font-size: 19px; font-weight: 700; fill: #94a3b8; letter-spacing: 2px; }
      .chip  { font-size: 21px; font-weight: 600; fill: #e2e8f0; }
      .key   { font-size: 19px; fill: #94a3b8; }
      .note  { font-size: 20px; fill: #94a3b8; font-style: italic; }
      .n     { fill: #7dd3fc; }
      .s     { fill: #fdba74; }
      .f     { fill: #86efac; }
      .dim   { fill: #94a3b8; }
      .kw    { fill: #c084fc; }
    </style>
  </defs>

  <!-- debug toolbar -->
  <g filter="url(#soft)">
    <rect x="500" y="10" width="600" height="58" rx="12" fill="url(#gPanel)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <polygon points="524,26 524,52 546,39" fill="#38bdf8"/>
  <text x="556" y="46" class="chip">Continue</text>
  <text x="652" y="46" class="key mono">F5</text>
  <path d="M 706 46 A 15 15 0 0 1 736 46" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
  <polygon points="729,42 742,42 736,52" fill="#38bdf8"/>
  <circle cx="721" cy="50" r="4" fill="#38bdf8"/>
  <text x="752" y="46" class="chip">Step Over</text>
  <text x="858" y="46" class="key mono">F10</text>
  <rect x="918" y="28" width="22" height="22" rx="3" fill="#f87171"/>
  <text x="950" y="46" class="chip">Stop</text>
  <text x="1002" y="46" class="key mono">Shift+F5</text>

  <!-- Variables panel -->
  <g filter="url(#soft)">
    <rect x="20" y="86" width="600" height="414" rx="14" fill="url(#gPanel)" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <text x="44" y="124" class="head">VARIABLES</text>
  <line x1="20" y1="140" x2="620" y2="140" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="180" class="var mono dim">v Locals</text>
  <text x="70" y="220" class="var mono dim">&gt; special variables</text>
  <rect x="34" y="234" width="572" height="36" rx="6" fill="#38bdf8" fill-opacity="0.10"/>
  <text x="96" y="260" class="var mono"><tspan class="n">line</tspan><tspan class="dim"> = </tspan><tspan class="s">'30,11.05'</tspan></text>
  <text x="70" y="300" class="var mono"><tspan class="dim">&gt; </tspan><tspan class="n">lines</tspan><tspan class="dim"> = </tspan><tspan class="s">['length_cm,t10_s', '20,9.0…</tspan></text>
  <rect x="34" y="314" width="572" height="36" rx="6" fill="#38bdf8" fill-opacity="0.10"/>
  <text x="70" y="340" class="var mono"><tspan class="dim">&gt; </tspan><tspan class="n">parts</tspan><tspan class="dim"> = </tspan><tspan class="s">['30', '11.05']</tspan></text>
  <text x="96" y="380" class="var mono"><tspan class="n">table</tspan><tspan class="dim"> = </tspan><tspan class="s">'length_cm,t10_s\n20,9.02\n…</tspan></text>
  <rect x="34" y="394" width="572" height="36" rx="6" fill="#38bdf8" fill-opacity="0.10"/>
  <text x="96" y="420" class="var mono"><tspan class="n">total</tspan><tspan class="dim"> = </tspan><tspan class="f">0.9019999999999999</tspan></text>
  <text x="44" y="466" class="var mono dim">&gt; Globals</text>

  <!-- Editor panel -->
  <g filter="url(#soft)">
    <rect x="640" y="86" width="940" height="414" rx="14" fill="url(#gPanel)" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="664" y="124" class="head" letter-spacing="0">mean_period.py</text>
  <line x1="640" y1="140" x2="1580" y2="140" stroke="#334155" stroke-width="1.5"/>

  <!-- the line the debugger stopped before -->
  <rect x="641" y="328" width="938" height="42" fill="#eab308" fill-opacity="0.20"/>
  <rect x="641" y="328" width="6" height="42" fill="#eab308"/>

  <g class="mono">
    <text x="726" y="182" class="num">12</text>
    <text x="750" y="182" class="code">lines = table.splitlines()</text>
    <text x="726" y="226" class="num">13</text>
    <text x="750" y="226" class="code">total = <tspan class="f">0.0</tspan></text>
    <text x="726" y="270" class="num">14</text>
    <text x="750" y="270" class="code"><tspan class="kw">for</tspan> line <tspan class="kw">in</tspan> lines[<tspan class="f">1</tspan>:]:</text>
    <text x="726" y="314" class="num">15</text>
    <text x="750" y="314" class="code" xml:space="preserve">    parts = line.split(<tspan class="s">","</tspan>)</text>
    <text x="726" y="358" class="num" fill="#e2e8f0">16</text>
    <text x="750" y="358" class="code" xml:space="preserve">    total = total + float(parts[<tspan class="f">1</tspan>]) / <tspan class="f">10</tspan></text>
    <text x="726" y="402" class="num">17</text>
    <text x="750" y="402" class="code">mean = total / len(lines)</text>
    <text x="726" y="446" class="num">18</text>
    <text x="750" y="446" class="code">print(mean)</text>
  </g>

  <!-- breakpoint -->
  <circle cx="668" cy="349" r="10" fill="#ef4444"/>

  <!-- callouts -->
  <text x="664" y="484" class="note">red dot: the breakpoint</text>
  <text x="1558" y="484" class="note" text-anchor="end">yellow: stopped before this line</text>
</svg>
