<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="'Space Grotesk','Inter','Helvetica Neue',Arial,sans-serif">
  <!-- Lecture 6: the commands of the lecture between the four places, in the
       lecture's own words (working folder, staging area, repository, remote). -->
  <defs>
    <marker id="arrAmber"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrGreen"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/></marker>
    <marker id="arrGray"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .cmd { font-family: 'Space Mono','JetBrains Mono','Fira Code',monospace; font-weight: 700; font-size: 24px; text-anchor: middle; }
      .head { font-size: 32px; font-weight: 700; text-anchor: middle; }
      .cap { font-size: 21px; fill: #cbd5e1; text-anchor: middle; }
    </style>
  </defs>

  <!-- The four places: x = 220, 600, 980, 1360 -->
  <rect x="60"   y="10" width="320" height="120" rx="16" fill="#0f1e3d" stroke="#38bdf8" stroke-width="2"/>
  <rect x="440"  y="10" width="320" height="120" rx="16" fill="#2a1a08" stroke="#f59e0b" stroke-width="2"/>
  <rect x="820"  y="10" width="320" height="120" rx="16" fill="#062a22" stroke="#10b981" stroke-width="2"/>
  <rect x="1200" y="10" width="320" height="120" rx="16" fill="#1f1640" stroke="#c084fc" stroke-width="2"/>
  <text x="220"  y="62" class="head" fill="#38bdf8">Working folder</text>
  <text x="220"  y="102" class="cap">the files on the disk</text>
  <text x="600"  y="62" class="head" fill="#f59e0b">Staging area</text>
  <text x="600"  y="102" class="cap">the next commit</text>
  <text x="980"  y="62" class="head" fill="#10b981">Repository</text>
  <text x="980"  y="102" class="cap">the commits, in .git</text>
  <text x="1360" y="62" class="head" fill="#c084fc">Remote</text>
  <text x="1360" y="102" class="cap">origin, on GitHub</text>

  <g stroke-dasharray="4 6" stroke-width="1.5" opacity="0.5">
    <line x1="220"  y1="145" x2="220"  y2="680" stroke="#38bdf8"/>
    <line x1="600"  y1="145" x2="600"  y2="680" stroke="#f59e0b"/>
    <line x1="980"  y1="145" x2="980"  y2="680" stroke="#10b981"/>
    <line x1="1360" y1="145" x2="1360" y2="680" stroke="#c084fc"/>
  </g>

  <!-- add, commit, push -->
  <path d="M 240 210 L 580 210" stroke="#f59e0b" stroke-width="3.5" fill="none" marker-end="url(#arrAmber)"/>
  <rect x="330" y="186" width="160" height="46" rx="9" fill="#1c1917" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="410" y="217" class="cmd" fill="#fde68a">git add</text>

  <path d="M 620 210 L 960 210" stroke="#10b981" stroke-width="3.5" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="695" y="186" width="190" height="46" rx="9" fill="#052e2b" stroke="#10b981" stroke-width="1.4"/>
  <text x="790" y="217" class="cmd" fill="#6ee7b7">git commit</text>

  <path d="M 1000 210 L 1340 210" stroke="#c084fc" stroke-width="3.5" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="1085" y="186" width="170" height="46" rx="9" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.4"/>
  <text x="1170" y="217" class="cmd" fill="#e9d5ff">git push</text>

  <!-- fetch: remote -> repository -->
  <path d="M 1340 300 L 1000 300" stroke="#c084fc" stroke-width="3.5" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="1080" y="276" width="180" height="46" rx="9" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.4"/>
  <text x="1170" y="307" class="cmd" fill="#e9d5ff">git fetch</text>

  <!-- merge: repository -> working folder -->
  <path d="M 960 390 L 240 390" stroke="#10b981" stroke-width="3.5" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="700" y="366" width="180" height="46" rx="9" fill="#052e2b" stroke="#10b981" stroke-width="1.4"/>
  <text x="790" y="397" class="cmd" fill="#6ee7b7">git merge</text>

  <!-- pull = fetch + merge: remote -> working folder -->
  <path d="M 1360 430 C 1360 530, 220 530, 220 430" stroke="#c084fc" stroke-width="3.5" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="700" y="482" width="180" height="46" rx="9" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.4"/>
  <text x="790" y="513" class="cmd" fill="#e9d5ff">git pull</text>

  <!-- the two diffs: compare, move nothing -->
  <path d="M 240 610 L 580 610" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-start="url(#arrGray)" marker-end="url(#arrGray)"/>
  <rect x="330" y="587" width="160" height="44" rx="8" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="410" y="617" class="cmd" fill="#e2e8f0">git diff</text>

  <path d="M 620 610 L 960 610" stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-start="url(#arrGray)" marker-end="url(#arrGray)"/>
  <rect x="650" y="587" width="280" height="44" rx="8" fill="#0b1220" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="790" y="617" class="cmd" fill="#e2e8f0">git diff --staged</text>

  <!-- Legend -->
  <g transform="translate(60, 718)">
    <rect x="0" y="-8" width="40" height="5" fill="#10b981"/>
    <text x="54" y="0" font-size="21" fill="#cbd5e1">solid: moves a change</text>
    <line x1="330" y1="-6" x2="370" y2="-6" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="384" y="0" font-size="21" fill="#cbd5e1">dashed: compares, moves nothing</text>
  </g>
</svg>
