<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="gWork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gIdx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gRemote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9"/>
    </linearGradient>

    <marker id="arrAmber"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrGreen"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#10b981"/></marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/></marker>
    <marker id="arrBlue"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="arrGray"   viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <marker id="arrAmberS"  viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <marker id="arrBlueS"   viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="arrGrayS"   viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .cmd { font-family: 'JetBrains Mono','Fira Code',monospace; font-weight: 600; }
      .caption { fill:#94a3b8; font-size:13px; }
    </style>
  </defs>

  <!-- Title -->
  <text x="800" y="55" text-anchor="middle" font-size="36" font-weight="700" fill="#f1f5f9">Git Data Flow</text>
  <text x="800" y="88" text-anchor="middle" font-size="18" fill="#94a3b8">Commands that move changes between the four stores</text>

  <!-- Lane headers -->
  <!-- 4 lanes at x = 220, 600, 980, 1360 -->
  <g filter="url(#soft)">
    <rect x="70"   y="120" width="300" height="110" rx="16" fill="url(#gWork)"   stroke="#38bdf8" stroke-width="2"/>
    <rect x="450"  y="120" width="300" height="110" rx="16" fill="url(#gIdx)"    stroke="#f59e0b" stroke-width="2"/>
    <rect x="830"  y="120" width="300" height="110" rx="16" fill="url(#gHead)"   stroke="#10b981" stroke-width="2"/>
    <rect x="1210" y="120" width="300" height="110" rx="16" fill="url(#gRemote)" stroke="#c084fc" stroke-width="2"/>
  </g>

  <g text-anchor="middle" font-weight="700">
    <text x="220"  y="160" font-size="22" fill="#38bdf8">📁 Working Directory</text>
    <text x="220"  y="190" font-size="13" class="caption">untracked / modified files</text>
    <text x="220"  y="213" font-size="12" fill="#64748b" class="cmd">on disk</text>

    <text x="600"  y="160" font-size="22" fill="#f59e0b">🗂️ Index</text>
    <text x="600"  y="190" font-size="13" class="caption">staging area</text>
    <text x="600"  y="213" font-size="12" fill="#64748b" class="cmd">.git/index</text>

    <text x="980"  y="160" font-size="22" fill="#10b981">📚 HEAD</text>
    <text x="980"  y="190" font-size="13" class="caption">local repository</text>
    <text x="980"  y="213" font-size="12" fill="#64748b" class="cmd">.git/objects</text>

    <text x="1360" y="160" font-size="22" fill="#c084fc">☁️ Remote Repo</text>
    <text x="1360" y="190" font-size="13" class="caption">origin (e.g. GitHub)</text>
    <text x="1360" y="213" font-size="12" fill="#64748b" class="cmd">origin/*</text>
  </g>

  <!-- Vertical swim lanes -->
  <g stroke-dasharray="4 6" stroke-width="1.5" opacity="0.5">
    <line x1="220"  y1="250" x2="220"  y2="1030" stroke="#38bdf8"/>
    <line x1="600"  y1="250" x2="600"  y2="1030" stroke="#f59e0b"/>
    <line x1="980"  y1="250" x2="980"  y2="1030" stroke="#10b981"/>
    <line x1="1360" y1="250" x2="1360" y2="1030" stroke="#c084fc"/>
  </g>

  <!-- ========== Row 1: forward promotion ========== -->
  <!-- git add: working -> index -->
  <path d="M 245 300 L 575 300" stroke="#f59e0b" stroke-width="3" fill="none" marker-end="url(#arrAmber)"/>
  <rect x="340" y="270" width="140" height="34" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="410" y="293" text-anchor="middle" font-size="15" fill="#fde68a" class="cmd">git add</text>

  <!-- git commit: index -> HEAD -->
  <path d="M 625 300 L 955 300" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="710" y="270" width="160" height="34" rx="8" fill="#052e2b" stroke="#10b981" stroke-width="1.2"/>
  <text x="790" y="293" text-anchor="middle" font-size="15" fill="#6ee7b7" class="cmd">git commit</text>

  <!-- git push: HEAD -> remote -->
  <path d="M 1005 300 L 1335 300" stroke="#c084fc" stroke-width="3" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="1095" y="270" width="150" height="34" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.2"/>
  <text x="1170" y="293" text-anchor="middle" font-size="15" fill="#e9d5ff" class="cmd">git push</text>

  <!-- ========== Row 2: fetch ========== -->
  <path d="M 1335 390 L 1005 390" stroke="#c084fc" stroke-width="3" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="1095" y="360" width="150" height="34" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.2"/>
  <text x="1170" y="383" text-anchor="middle" font-size="15" fill="#e9d5ff" class="cmd">git fetch</text>

  <!-- ========== Row 3: merge + pull ========== -->
  <!-- git merge: HEAD -> working -->
  <path d="M 955 480 L 245 480" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="710" y="450" width="160" height="34" rx="8" fill="#052e2b" stroke="#10b981" stroke-width="1.2"/>
  <text x="790" y="473" text-anchor="middle" font-size="15" fill="#6ee7b7" class="cmd">git merge</text>

  <!-- git pull: remote -> working (long arc) -->
  <path d="M 1360 520 C 1360 610, 220 610, 220 520" stroke="#c084fc" stroke-width="3" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="720" y="595" width="140" height="34" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.2"/>
  <text x="790" y="618" text-anchor="middle" font-size="15" fill="#e9d5ff" class="cmd">git pull</text>

  <!-- ========== Row 4: diffs ========== -->
  <!-- git diff HEAD: working <-> HEAD (spans index) -->
  <path d="M 245 700 L 955 700" stroke="#60a5fa" stroke-width="2.5" fill="none" stroke-dasharray="8 5" marker-start="url(#arrBlueS)" marker-end="url(#arrBlue)"/>
  <rect x="510" y="670" width="180" height="34" rx="8" fill="#0b1220" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="600" y="693" text-anchor="middle" font-size="15" fill="#bfdbfe" class="cmd">git diff HEAD</text>

  <!-- git diff: working <-> index -->
  <path d="M 245 770 L 575 770" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-start="url(#arrGrayS)" marker-end="url(#arrGray)"/>
  <rect x="350" y="740" width="120" height="32" rx="7" fill="#0b1220" stroke="#94a3b8" stroke-width="1"/>
  <text x="410" y="762" text-anchor="middle" font-size="14" fill="#cbd5e1" class="cmd">git diff</text>

  <!-- git diff staged: index to HEAD -->
  <path d="M 625 770 L 955 770" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-start="url(#arrGrayS)" marker-end="url(#arrGray)"/>
  <rect x="720" y="740" width="160" height="32" rx="7" fill="#0b1220" stroke="#94a3b8" stroke-width="1"/>
  <text x="800" y="762" text-anchor="middle" font-size="14" fill="#cbd5e1" class="cmd">git diff --staged</text>

  <!-- ========== Row 5: commit -a (working -> HEAD, bypassing index) ========== -->
  <path d="M 245 860 C 400 900, 800 900, 955 860" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="520" y="895" width="170" height="34" rx="8" fill="#052e2b" stroke="#10b981" stroke-width="1.2"/>
  <text x="605" y="918" text-anchor="middle" font-size="15" fill="#6ee7b7" class="cmd">git commit -a</text>

  <!-- ========== Row 6: diff between commits ========== -->
  <path d="M 900 980 L 1060 980" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-start="url(#arrGrayS)" marker-end="url(#arrGray)"/>
  <rect x="870" y="1000" width="220" height="32" rx="7" fill="#0b1220" stroke="#94a3b8" stroke-width="1"/>
  <text x="980" y="1022" text-anchor="middle" font-size="14" fill="#cbd5e1" class="cmd">git diff &lt;sha1&gt; &lt;sha2&gt;</text>

  <!-- Legend -->
  <g transform="translate(70, 1020)">
    <rect x="0" y="0" width="18" height="4" fill="#10b981"/>
    <text x="28" y="6" font-size="13" fill="#cbd5e1">solid = promote changes</text>
    <line x1="240" y1="2" x2="280" y2="2" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="290" y="6" font-size="13" fill="#cbd5e1">dashed = inspect / compare</text>
  </g>
</svg>
