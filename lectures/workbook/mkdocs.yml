site_name: Best Research and Data Analysis Practices from CERN
site_description: Seminar briefs, overview and lecture notes for the course.
# Deployed under the course site at <site>/workbook/ (scripts/build-all.mjs + deploy.yml).
site_url: https://mindaugassarpis.github.io/CERN_lessons_on_data_analysis/workbook/

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/course.css


nav:
  - Home: index.md
  - Lecture notes:
      - 01 Orientation & Motivation: lectures/lecture_1.md
      - 02 Introduction to Data: lectures/lecture_2.md
      - 03 How Computers Work: lectures/lecture_3.md
      - 04 Command Line & File Handling: lectures/lecture_4.md
      - 05 Version Control with Git: lectures/lecture_5.md
      - 06 Python Foundations: lectures/lecture_6.md
      - 07 Python for Data & NumPy: lectures/lecture_7.md
      - 08 Data Visualisation: lectures/lecture_8.md
      - 09 Probability & Statistics: lectures/lecture_9.md
      - 10 Data Fitting from First Principles: lectures/lecture_10.md
      - 11 The Perceptron: lectures/lecture_11.md
      - 12 Pandas & Data Cleaning: lectures/lecture_12.md
      - 13 Reproducible Workflows & Automation: lectures/lecture_13.md
      - 14 Concepts of Data Analysis: lectures/lecture_14.md
      - 15 Computing Infrastructure & HPC: lectures/lecture_15.md
      - 16 Machine Learning & AI: lectures/lecture_16.md
      - Miscellaneous: lectures/misc.md
  - Seminars:
      - Overview: seminars/overview.md
      - S1 VS Code, Markdown & text editing: seminars/seminar_01.md
      - S3 A file as bytes: seminars/seminar_03.md
      - S4 Work on Files from the Shell: seminars/seminar_04.md
      - S4 · Install Python, Git and PowerShell 7: seminars/install_python_git.md
      - S5 The Project Folder under Git: seminars/seminar_05.md
      - S6 A Line of Text into Numbers: seminars/seminar_06.md
      - S7 The Whole File in Python: seminars/seminar_07.md
      - S8 Two Figures with Matplotlib: seminars/seminar_08.md
      - S9 A Result with Its Uncertainty: seminars/seminar_09.md
      - S10 Fit a Straight Line and Measure g: seminars/seminar_10.md
      - S11 A Perceptron from an Empty File: seminars/seminar_11.md
      - S12 Clean a Table by Script: seminars/seminar_12.md
      - S13 One Command Rebuilds the Analysis: seminars/seminar_13.md
      - S14 Review an Analysis, Plan the Data: seminars/seminar_14.md
      - S15 Timing, Memory and a Background Job: seminars/seminar_15.md
      - S16 A Small Network, Measured: seminars/seminar_16.md
