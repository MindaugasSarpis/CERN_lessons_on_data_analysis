site_name: Best Research and Data Analysis Practices from CERN
site_description: Seminar briefs, overview and lecture notes for the course.
# Deployed under the course site at <site>/workbook/ (scripts/build-all.mjs + deploy.yml).
site_url: https://mindaugassarpis.github.io/CERN_lessons_on_data_analysis/workbook/

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        # drawn by javascripts/steps.js, not by Material, so the step view
        # can draw a diagram again
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/steps.js

extra_css:
  - stylesheets/course.css


nav:
  - Home: index.md
  - Setup: setup.md
  - Lecture notes:
      - 01 Orientation & Motivation: lectures/lecture_1.md
      - 02 Introduction to Data: lectures/lecture_2.md
      - 03 How Computers Work: lectures/lecture_3.md
      - 04 Command Line & File Handling: lectures/lecture_4.md
      - 05 Version Control with Git: lectures/lecture_5.md
      - 06 Python Foundations: lectures/lecture_6.md
      - 07 Python for Data & NumPy: lectures/lecture_7.md
      - 08 Data Visualisation: lectures/lecture_8.md
      - 09 Probability & Statistics: lectures/lecture_9.md
      - 10 Data Fitting from First Principles: lectures/lecture_10.md
      - 11 The Perceptron: lectures/lecture_11.md
      - 12 Pandas & Data Cleaning: lectures/lecture_12.md
      - 13 Reproducible Workflows & Automation: lectures/lecture_13.md
      - 14 Concepts of Data Analysis: lectures/lecture_14.md
      - 15 Computing Infrastructure & HPC: lectures/lecture_15.md
      - 16 Machine Learning & AI: lectures/lecture_16.md
      - Miscellaneous: lectures/misc.md
  - Seminars:
      - Overview: seminars/overview.md
      - S1 What Do the Weather Files Say?: seminars/seminar_01.md
      - S3 What Are the 148 Bytes of daily.csv?: seminars/seminar_03.md
      - S4 What Is the Mean Temperature of Ten Years?: seminars/seminar_04.md
      - S4 · Install Python and Git: seminars/install_python_git.md
      - S5 Who Changed the Mean?: seminars/seminar_05.md
      - S6 Can You Compute 7.16 Yourself?: seminars/seminar_06.md
      - S7 Is It Getting Warmer?: seminars/seminar_07.md
      - S8 What Does a Year of Weather Look Like?: seminars/seminar_08.md
      - S9 How Sure Is 7.16?: seminars/seminar_09.md
      - S10 How Strong Is the Yearly Cycle?: seminars/seminar_10.md
      - S11 Will It Freeze Tonight?: seminars/seminar_11.md
      - S12 How Cold Is the Hill?: seminars/seminar_12.md
      - S13 Can a Stranger Rebuild Every Number?: seminars/seminar_13.md
      - S14 Was October 2025 Unusually Warm?: seminars/seminar_14.md
      - S15 How Long Does It Take, and How to Make It Faster?: seminars/seminar_15.md
      - S16 Can a Model Forecast Tomorrow's Temperature?: seminars/seminar_16.md
